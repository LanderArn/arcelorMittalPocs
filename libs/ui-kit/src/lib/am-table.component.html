<p-table [value]="data()" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      @for (column of columns(); track column.key) {
        <th>{{ column.label }}</th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-data>
    <tr>
      <td>{{ data.id }}</td>
      <td>{{ data.wasteType.name }}</td>
      <td>{{ data.capacityKg }}</td>
      <td>{{ data.currentFillLevelKg }}</td>
    </tr>
  </ng-template>
</p-table>
